<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepSeek Quick</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script type="module" src="/src/mini.ts"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: rgba(18, 18, 18, 0.95);
            --bg-secondary: rgba(28, 28, 28, 0.98);
            --bg-tertiary: rgba(38, 38, 38, 0.98);
            --bg-hover: rgba(255, 255, 255, 0.06);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.5);
            --accent: #4F8CFF;
            --accent-hover: #3A7AEE;
            --error: #F44336;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            --radius-lg: 14px;
            --radius-md: 10px;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent;
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }
        
        .mini-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-primary);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
            overflow: hidden;
        }
        
        /* Header */
        .mini-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .mini-header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .mini-header .icon {
            width: 20px;
            height: 20px;
            border-radius: 5px;
            object-fit: contain;
            display: block;
        }
        
        .mini-header .title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .mini-header-right {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .header-action {
            width: 26px;
            height: 26px;
            border: none;
            background: transparent;
            color: var(--text-tertiary);
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        
        .header-action:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }
        
        /* Messages Area */
        .messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .messages-area:empty::before {
            content: 'Ask anything...';
            display: block;
            text-align: center;
            color: var(--text-tertiary);
            font-size: 13px;
            margin-top: 40px;
        }
        
        /* Message Bubbles */
        .msg {
            display: flex;
            gap: 8px;
            animation: fadeIn 0.2s ease;
            max-width: 100%;
        }
        
        .msg.user {
            flex-direction: row-reverse;
        }
        
        .msg-avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: white;
            flex-shrink: 0;
        }
        
        .msg.user .msg-avatar {
            background: var(--accent);
        }
        
        .msg.assistant .msg-avatar {
            background: transparent;
            padding: 2px;
        }
        
        .msg.assistant .msg-avatar img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
        }
        
        .msg-bubble {
            padding: 10px 13px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.55;
            max-width: calc(100% - 36px);
            word-wrap: break-word;
        }
        
        .msg.user .msg-bubble {
            background: var(--accent);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .msg.assistant .msg-bubble {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }
        
        .msg-bubble code {
            background: rgba(255,255,255,0.1);
            padding: 1px 4px;
            border-radius: 3px;
            font-family: 'Consolas', monospace;
            font-size: 12px;
        }
        
        .msg-bubble pre {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            overflow-x: auto;
            margin: 6px 0;
            font-size: 12px;
        }
        
        .msg-bubble pre code {
            background: transparent;
            padding: 0;
        }
        
        /* Input Area */
        .input-area {
            padding: 10px 14px 12px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        
        .input-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            transition: border-color 0.2s ease;
        }
        
        .input-bar:focus-within {
            border-color: var(--accent);
        }
        
        .input-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }
        
        .input-bar input::placeholder {
            color: var(--text-tertiary);
        }
        
        .input-bar .send-btn {
            width: 28px;
            height: 28px;
            border: none;
            background: var(--accent);
            color: white;
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease;
            flex-shrink: 0;
        }
        
        .input-bar .send-btn:hover {
            background: var(--accent-hover);
        }
        
        .input-bar .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .input-hint {
            text-align: center;
            margin-top: 6px;
            font-size: 10px;
            color: var(--text-tertiary);
        }
        
        /* Typing indicator */
        .typing-msg {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 4px 0;
        }
        
        .typing-dots {
            display: flex;
            gap: 3px;
            padding: 10px 13px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            border-bottom-left-radius: 4px;
        }
        
        .typing-dots .dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        
        .typing-dots .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots .dot:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Error toast */
        .error-toast {
            padding: 8px 14px;
            background: rgba(244, 67, 54, 0.15);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: var(--radius-md);
            font-size: 12px;
            color: var(--error);
            display: none;
            margin: 0 14px;
            flex-shrink: 0;
        }
        
        .error-toast.visible {
            display: block;
        }
        
        /* Drag overlay */
        .drag-overlay {
            display: flex;
            position: absolute;
            inset: 0;
            z-index: 100;
            background: rgba(79, 140, 255, 0.12);
            border: 2px dashed var(--accent);
            border-radius: var(--radius-lg);
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
            text-align: center;
        }
        .drag-overlay.active {
            opacity: 1;
            visibility: visible;
            animation: dragPulse 1.2s ease-in-out infinite;
        }
        @keyframes dragPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }
    </style>
</head>
<body>
    <div class="mini-app">
        <div class="drag-overlay" id="dragOverlay">Drop files here</div>
        <div class="mini-header">
            <div class="mini-header-left">
                <img class="icon" src="/deepseek-icon.png" alt="DeepSeek" />
                <span class="title">DeepSeek Quick</span>
            </div>
            <div class="mini-header-right">
                <button class="header-action" id="attachBtn" title="Attach file">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <button class="header-action" id="newChatBtn" title="New chat">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
                <button class="header-action" id="openMainBtn" title="Open full app">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                </button>
                <button class="header-action" id="closeBtn" title="Close">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
        </div>
        
        <div class="error-toast" id="errorToast"></div>
        
        <div class="messages-area" id="messagesArea"></div>
        
        <div class="input-area">
            <div class="input-bar" id="inputBar">
                <input 
                    type="text" 
                    id="miniInput" 
                    placeholder="Ask anything..." 
                    autocomplete="off"
                />
                <button class="send-btn" id="sendBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                </button>
            </div>
            <div class="input-hint">Enter to send · Esc to close · Drag & drop files</div>
        </div>
    </div>
    <input type="file" id="fileInput" style="display:none;" accept=".txt,.md,.json,.js,.ts,.html,.css,.py,.java,.cpp,.c,.h,.rs,.go,.rb,.php,.sql,.xml,.yaml,.yml,.ini,.cfg,.log,.pdf,.png,.jpg,.jpeg,.gif,.bmp,.webp" />
</body>
</html>
